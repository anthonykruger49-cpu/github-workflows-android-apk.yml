name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack app source
        run: mkdir -p app && tar -xzf build-source/swift-route-courier-source.tar.gz -C app

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: app

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: app
        env:
          CI: "1"

      - name: Build installable debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug
        working-directory: app/android

      - name: Name APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk swift-route-courier-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-route-courier-debug-apk
          path: swift-route-courier-debug.apk
          if-no-files-found: error
          retention-days: 30
